# Glossary of terms that get a hover definition in post bodies.
#
# The build wraps the FIRST occurrence of each term in each post. Later uses in
# the same post are left alone, so a reader gets the definition once rather
# than a page speckled with dotted underlines.
#
# Two forms work:
#
#   simple-term: "A one sentence definition."
#
#   richer-term:
#     definition: "A one sentence definition."
#     aliases: [other spelling, plural form]
#     source: https://example.com/where-this-definition-comes-from
#
# Keep definitions to one sentence and plain. A definition that needs its own
# jargon has not defined anything. Matching is case-insensitive and respects
# word boundaries, so "mean" will not match inside "meaning".

hedonic:
  definition: "Concerned with pleasure and feeling good, as opposed to purpose or meaning."
  aliases: [hedonia, hedonic well-being]

eudaimonic:
  definition: "Concerned with purpose, meaning and living well, as opposed to feeling good moment to moment."
  aliases: [eudaimonia, eudaimonic well-being]

cross-sectional:
  definition: "A study that measures everyone at a single point in time, which can show that two things go together but not that one causes the other."

positive affect:
  definition: "Psychologists' term for the experience of pleasant feelings such as enthusiasm, alertness and contentment."

Big Five:
  definition: "The five broad personality traits most widely used in psychology: openness, conscientiousness, extraversion, agreeableness and emotional stability."
  aliases: [Big Five personality traits]

openness to experience:
  definition: "The Big Five trait covering curiosity, imagination and appetite for new ideas and experiences."

construct:
  definition: "In psychology, a thing researchers propose and then try to measure, such as intelligence or well-being, rather than something observed directly."

effect size:
  definition: "How large an effect is, as opposed to whether it exists at all. A result can be statistically reliable and still be too small to matter."

experience sampling:
  definition: "A method that pings people at intervals during ordinary life to record what they are doing and feeling, rather than asking them to remember later."

replication:
  definition: "Running a study again, independently, to see whether the original result holds up."
  aliases: [replicated, replicate]

self-report:
  definition: "Data collected by asking people about themselves, which is cheap and informative but vulnerable to memory and to what people want to appear true."

correlational:
  definition: "Showing that two things vary together, without establishing that either one causes the other."
  aliases: [correlates, correlate, correlation]

tumour suppressor gene:
  definition: "A gene whose normal job is to stop cells dividing out of control, so losing it raises cancer risk."
  aliases: [tumor suppressor gene, tumour suppressor genes, tumor suppressor genes]

retrogene:
  definition: "An extra copy of a gene made when its message was copied back into the DNA, which may or may not still work."
  aliases: [retrogenes]

apoptosis:
  definition: "A built-in process by which a cell deliberately kills itself, often when it is damaged."

neoplasia:
  definition: "Abnormal tissue growth, which includes both harmless tumours and cancers."

comparative study:
  definition: "Research that looks for patterns across many species at once rather than experimenting on one."
  aliases: [comparative studies]

risk compensation:
  definition: "The idea that people respond to a safety improvement by taking more risk, using up some of the protection it gives."
  aliases: [Peltzman effect, compensating behaviour, compensating behavior]

panel data:
  definition: "Measurements of the same set of units, such as states or people, repeated over several years."

instrumental variable:
  definition: "Something that shifts the thing being studied but has no other route to the outcome, used to tell cause apart from mere association."
  aliases: [instrumental variables, instrumented]

statistical power:
  definition: "The chance that a study will detect an effect of a given size if that effect is really there."

time series:
  definition: "A sequence of measurements of the same quantity taken at regular intervals over time."
  aliases: [time-series]

meta-analysis:
  definition: "A study that pools the results of many earlier studies on the same question to estimate an overall effect and what makes it vary."
  aliases: ["meta-analyses", "meta-analytic"]

free recall:
  definition: "A memory test in which people write down everything they can remember from a list, in any order, with no hints."

cued recall:
  definition: "A memory test in which people are given a hint, such as the word that was paired with the target, and asked to supply the item that went with it."

publication bias:
  definition: "The tendency for studies with striking or positive results to be published more often than studies that found nothing, which can inflate pooled estimates."

within-subjects:
  definition: "A study design in which the same people take part in every condition being compared, rather than different people in each."
  aliases: ["within-subjects designs", "within-subjects design"]

scaling law:
  definition: "A formula, fitted to experiments, that predicts how a system's performance changes as it is made larger or given more resources."
  aliases: ["scaling laws"]

power law:
  definition: "A relationship in which one quantity changes in proportion to another raised to a fixed power, so it looks like a straight line on a log-log plot."
  aliases: ["power laws"]

compute-optimal:
  definition: "Describing the split between model size and amount of training text that gives the best result for a fixed amount of computing."

learning rate:
  definition: "A setting that controls how large an adjustment a model makes to itself after each batch of training examples."
  aliases: ["learning rates"]

confidence interval:
  definition: "A range of values, calculated from data, that is meant to show how precisely a quantity has been estimated."
  aliases: ["confidence intervals"]

common-value auction:
  definition: "An auction for something that is worth about the same to every bidder, though no bidder knows exactly how much."
  aliases: ["common-value auctions", "common value auction", "common value auctions"]

"winner's curse":
  definition: "The tendency for the winner of an auction for something of uncertain value to have paid more than it is worth, because the highest bid usually comes from the most optimistic guess."
  aliases: ["winners curse"]

Nash equilibrium:
  definition: "A situation in a game where no player can do better by changing their own choice while everyone else keeps theirs."
  aliases: ["Nash equilibria"]

discount rate:
  definition: "The yearly rate used to shrink money received in the future to what it is worth today."
  aliases: ["discount rates"]

emergent ability:
  definition: "A skill that seems absent in smaller AI models and then appears in larger ones, in a way that trends from the smaller models would not have predicted."
  aliases: ["emergent abilities"]

exact match:
  definition: "A way of scoring an answer that gives full credit only if it is completely right and nothing otherwise."
  aliases: ["exact-match", "exact string match"]

Brier score:
  definition: "A measure of how far a forecaster's stated probabilities were from what actually happened, where lower is better."
  aliases: ["Brier scores"]

pre-training loss:
  definition: "A number showing how badly a language model predicts the next piece of text in its training material, where lower means better prediction."
  aliases: ["pretraining loss"]

in-context learning:
  definition: "A language model's ability to do a task from instructions or examples given in the prompt, without being retrained."

Hawthorne effect:
  definition: "The claim that people change how they behave because they know they are being studied or watched."
  aliases: ["Hawthorne effects"]

systematic review:
  definition: "A study that searches for every piece of research on a question using set rules and then summarises what they found together."
  aliases: ["systematic reviews"]

odds ratio:
  definition: "A number comparing how likely an outcome is in one group with how likely it is in another, where 1 means no difference."
  aliases: ["odds ratios"]

confounding:
  definition: "When a third factor that moves alongside the thing being studied makes it look as if one causes the other."
  aliases: ["confounder", "confounders", "confounded"]

sycophancy:
  definition: "The tendency of an AI model to shape its answers to agree with what the user seems to believe or want."
  aliases: ["sycophantic"]

reinforcement learning from human feedback:
  definition: "A way of training an AI model by having people rate its answers and then adjusting the model to produce answers like the highly rated ones."
  aliases: ["RLHF"]

fine-tuning:
  definition: "Further training of an already trained AI model on a smaller, chosen set of examples to change how it behaves."
  aliases: ["fine-tuned", "finetuning", "fine-tune"]

user equilibrium:
  definition: "The pattern of traffic that results when every driver takes whichever route is quickest for them given everyone else's choices."
  aliases: ["user optimal flow", "user optimum"]

price of anarchy:
  definition: "How much worse a shared outcome gets when everyone acts for themselves, compared with the best arrangement a central planner could choose."

"Braess's paradox":
  definition: "The finding that adding a route to a congested network can make every traveller's journey slower."
  aliases: ["Braess paradox"]

model collapse:
  definition: "A gradual loss of variety and accuracy in AI models that are trained, round after round, on output produced by earlier models."

synthetic data:
  definition: "Data produced by a computer model rather than collected from real people or events."

variational autoencoder:
  definition: "A type of AI model that learns to squeeze examples into a compact summary and rebuild new, similar examples from it."
  aliases: ["variational autoencoders", "VAE", "VAEs"]

thought experiment:
  definition: "An imagined scenario used to test an idea by asking what we would judge or expect if it were real."
  aliases: ["thought experiments"]

status quo bias:
  definition: "A tendency to prefer the current state of affairs over a change, even when the alternative is no worse."

experimental philosophy:
  definition: "The use of surveys and experiments to study how people respond to questions that philosophers argue about."

vignette:
  definition: "A short written story given to participants in a study, who are then asked to make a judgement about it."
  aliases: ["vignettes"]

data contamination:
  definition: "When the questions used to test an AI model, or close copies of them, were already in the material it learned from."
  aliases: ["benchmark contamination"]

overfitting:
  definition: "When a model fits the quirks of the particular examples it was tuned on so closely that it does worse on new examples."
  aliases: ["overfit", "overfits", "overfitted"]

large language model:
  definition: "A computer program trained on very large amounts of text to predict and produce written language."
  aliases: ["large language models", "LLM", "LLMs"]

Red Queen hypothesis:
  definition: "The idea that species must keep evolving just to keep pace with the other species, such as parasites, that are evolving around them."
  aliases: ["Red Queen"]

outcrossing:
  definition: "Reproduction in which an individual mates with a different individual rather than fertilising its own eggs."
  aliases: ["outcross", "outcrossed"]

self-fertilisation:
  definition: "Reproduction in which one individual fertilises its own eggs, so offspring get genes from a single parent."
  aliases: ["self-fertilization", "selfing", "self-fertilising", "self-fertilizing"]

recombination:
  definition: "The shuffling of genes from two parents into new combinations during sexual reproduction."
  aliases: ["genetic recombination"]

coevolution:
  definition: "Evolution in which two species, such as a host and its parasite, keep adapting in response to each other."
  aliases: ["coevolving", "coevolve", "coevolved"]

context window:
  definition: "The maximum amount of text a language model can take in and consider at once."
  aliases: ["context size", "context sizes", "context length"]

retrieval-augmented generation:
  definition: "A way of using a language model in which relevant documents are first looked up and then given to the model along with the question."
  aliases: ["retrieval augmented generation", "RAG"]

needle-in-a-haystack:
  definition: "A test in which a single fact is hidden somewhere in a long text and a model is asked to find it."
  aliases: ["needle in a haystack"]

encoder-decoder:
  definition: "A model design with one part that reads the whole input and a second part that writes the output."
  aliases: ["encoder-decoder model", "encoder-decoder models"]

preprint:
  definition: "A research paper shared publicly before, or without, formal peer review by a journal."
  aliases: ["preprints"]

hot hand:
  definition: "The idea that someone who has just succeeded several times in a row is more likely than usual to succeed on the next try."
  aliases: ["hot-hand", "hot hand fallacy"]

streak selection bias:
  definition: "A downward distortion that appears when you measure what happens right after a run of outcomes within a short sequence, even when every outcome is pure chance."

law of small numbers:
  definition: "The habit of expecting small samples to look as balanced as the long-run averages they come from."

randomised controlled trial:
  definition: "A study in which chance decides who or what gets a treatment, so that later differences can be put down to the treatment."
  aliases: ["randomized controlled trial", "randomised controlled trials", "randomized controlled trials", "RCT", "RCTs"]

preregistered:
  definition: "Describes a study whose plan and main analyses were published before the data were collected."
  aliases: ["pre-registered", "preregistration", "pre-registration"]

staggered rollout:
  definition: "Introducing a change to different groups at different times, so that groups that have it can be compared with groups that do not yet."

mere exposure effect:
  definition: "The tendency for people to like something more simply because they have seen or heard it more often."
  aliases: ["mere exposure", "exposure effect"]

control group:
  definition: "The people in a study who do not receive the treatment, so that the treated group can be compared against them."
  aliases: ["control groups"]

reward model:
  definition: "A model trained to predict which of two outputs people would prefer, used to score an AI system's outputs during training."
  aliases: ["reward models", "preference model", "preference models"]

"Goodhart's law":
  definition: "The observation that a measure stops tracking what it was meant to track once people or systems aim directly at raising it."
  aliases: ["Goodhart effect", "Goodhart effects"]

KL divergence:
  definition: "A number measuring how different one probability distribution is from another, here how far a trained model has moved from where it started."
  aliases: ["Kullback-Leibler divergence"]

best-of-n sampling:
  definition: "Generating several candidate outputs and keeping the one that scores highest."
  aliases: ["best-of-n"]

reward hacking:
  definition: "When an AI system gets a high score on its training reward in ways its designers did not intend and do not want."
  aliases: ["reward gaming", "specification gaming"]

placebo test:
  definition: "A check that runs the same analysis where no effect should exist, such as before a change happened, to see whether the method finds one anyway."
  aliases: ["placebo tests"]

log points:
  definition: "A way of measuring proportional change, where 0.1 log points is roughly a 10 percent increase for small changes."
  aliases: ["log point"]

chain of thought:
  definition: "Step-by-step reasoning that a language model writes out before giving its final answer."
  aliases: ["chain-of-thought"]

reasoning model:
  definition: "A language model trained to write out long reasoning before it answers."
  aliases: ["reasoning models"]

inverse scaling:
  definition: "A pattern where a model gets worse at something as it is made larger."

supercooling:
  definition: "When a liquid cools below its normal freezing point without turning solid, because ice has not yet started to form."
  aliases: ["supercooled"]

nucleation:
  definition: "The first formation of a tiny seed of a new phase, such as a speck of ice in water, from which the rest can grow."

thermocouple:
  definition: "A temperature sensor made from two different metals joined together, which produce a small voltage that changes with temperature."
  aliases: ["thermocouples"]

Markov process:
  definition: "A random process in which what happens next depends only on the current state, not on how the system got there."
  aliases: ["Markov processes", "Markovian"]

colloidal:
  definition: "Describing very small particles, typically less than a thousandth of a millimetre across, suspended in a liquid."
  aliases: ["colloid", "colloids"]

perplexity:
  definition: "A measure of how surprised a language model is by a piece of text; predictable wording gives low perplexity."

false positive rate:
  definition: "The share of cases that are truly negative which a test nonetheless wrongly labels as positive."
  aliases: ["false positive rates"]

base rate:
  definition: "How common something is in the group being tested, before any test result is known."
  aliases: ["base rates"]

watermark:
  definition: "A hidden statistical pattern deliberately built into generated text so that it can later be recognised as machine-made."
  aliases: ["watermarking", "watermarked"]

p-value:
  definition: "The probability of seeing a result at least this extreme if there were really nothing going on."
  aliases: ["p-values"]

information density:
  definition: "How much information, in bits, each unit of speech such as a syllable carries on average."

information rate:
  definition: "How much information a speaker conveys per second, found by multiplying information per syllable by syllables per second."
  aliases: ["information rates"]

conditional entropy:
  definition: "A measure of how unpredictable something is once you already know what came just before it."

capture the flag:
  definition: "A hacking exercise in which the goal is to break into a prepared system and retrieve a hidden piece of data."
  aliases: ["capture-the-flag"]

supply-chain attack:
  definition: "An attack that slips harmful code into software that other people depend on, so it spreads to everyone who uses it."
  aliases: ["supply-chain attacks", "supply chain attack"]

evaluation awareness:
  definition: "A model noticing, or saying, that it is probably being tested rather than used for real."

motivated reasoning:
  definition: "Reasoning that bends toward a conclusion already preferred, rather than following the evidence."

human factors:
  definition: "The field that studies how people interact with machines and systems, and how to design those systems around human abilities and limits."

flight management computer:
  definition: "The aircraft computer that plans the route and can steer the plane along it automatically."

world model:
  definition: "An AI system that predicts how a scene or environment changes in response to actions, so it can generate or simulate a world someone can move through."
  aliases: [world models]

research preview:
  definition: "An early release of a product to a limited group of users so the developer can gather feedback before a wider launch."

admissible:
  definition: "Said of an estimation method when no other method is at least as accurate in every possible situation and more accurate in some."
  aliases: [inadmissible, admissibility]

James-Stein estimator:
  definition: "A method that estimates several averages at once by pulling each one toward their overall mean, which lowers the total error when there are three or more."

squared error:
  definition: "The difference between an estimate and the true value, multiplied by itself, so that large misses count much more than small ones."
  aliases: [total squared error, mean squared error]

empirical Bayes:
  definition: "A family of methods that use the spread of many related measurements to decide how much to trust each single one."

mixture of experts:
  definition: "A model design split into many sub-networks, where only a few of them are switched on for each piece of input, so most of the model sits idle at any moment."
  aliases: [mixture-of-experts]

open-weight:
  definition: "Describes an AI model whose trained parameters are published so anyone can download and run it, even if the training data and code are not."
  aliases: [open weights, open-weight models]

hemispheric lateralisation:
  definition: "The way some tasks rely more on one half of the brain than the other."
  aliases: [lateralisation, lateralization, hemispheric lateralization]

post hoc:
  definition: "Describes an analysis chosen after looking at the data, which makes a chance pattern easier to mistake for a real one."

AI agent:
  definition: "An AI system that carries out multi-step tasks on its own, such as running code or using tools, rather than only answering one message at a time."
  aliases: [AI agents, coding agent, coding agents]

system prompt:
  definition: "Instructions given to a chatbot by whoever deploys it, usually hidden from the person typing to it."
  aliases: [system prompts]

causal inference:
  definition: "Methods for working out whether one thing actually causes another, rather than merely going along with it."

side-effect effect:
  definition: "The finding that people judge a foreseen side effect as more intentional when it is harmful than when it is helpful."
  aliases: [Knobe effect]

theory of mind:
  definition: "The everyday ability to work out what other people believe, want and intend."

random assignment:
  definition: "Putting each participant into a study condition by chance, so that the groups differ only in what the researchers changed."
  aliases: [randomly assigned]

token:
  definition: "A small chunk of text, often a word or part of a word, that a language model reads or writes as one unit."
  aliases: [tokens]

inference engine:
  definition: "The software that runs a trained AI model on hardware to answer requests."
  aliases: [inference engines]

KV cache:
  definition: "Working memory a language model keeps while processing a request, storing intermediate results for the text it has already read."
  aliases: [KV caches]

prefill:
  definition: "The first stage of answering a request, in which the model reads the whole prompt before it starts writing a reply."

tenant isolation:
  definition: "Keeping each customer's data separate when many customers share the same computers or service."

bias-variance trade-off:
  definition: "The classical idea that a model too simple misses real patterns while a model too flexible chases noise, so the best model sits in between."

double descent:
  definition: "A pattern where a model's error on new data falls, rises to a peak, then falls again as the model is made larger."

interpolation threshold:
  definition: "The model size at which a model first has just enough capacity to fit every training example exactly."

label noise:
  definition: "Training examples whose recorded answers are wrong, whether by accident or on purpose in an experiment."

minimum-norm solution:
  definition: "Among all settings of a model that fit the training data perfectly, the one with the smallest overall size of its numbers, which tends to be the smoothest."

early stopping:
  definition: "Ending a model's training before it finishes fitting the training data, at the point where its error on held-out data is lowest."

human-in-the-loop:
  definition: "A design in which a person must review or approve certain actions before an automated system can carry them out."
  aliases: [HITL]

one-time passcode:
  definition: "A short code, usually sent by email or text message, that works only once and confirms a request came from the account owner."
  aliases: [one-time passcodes, one-time code, one-time codes]

prompt injection:
  definition: "Text hidden in content an AI system reads, such as an email or web page, that tries to make it follow the attacker's instructions instead of the user's."
  aliases: [prompt injections]

stablecoin:
  definition: "A cryptocurrency designed to keep a fixed value, usually one US dollar per coin."
  aliases: [stablecoins]

ice core:
  definition: "A long cylinder of ice drilled from a glacier or ice sheet, whose layers preserve air, dust and chemicals from the years the snow fell."
  aliases: [ice cores]

smelting:
  definition: "Heating ore to a high temperature to extract the metal from it."

radiocarbon dating:
  definition: "Estimating the age of once-living material from how much of a slowly decaying form of carbon it still contains."

emergent misalignment:
  definition: "When training a model on a narrow kind of bad behaviour makes it behave badly in many unrelated situations too."

red team:
  definition: "A group, person or system whose job is to attack a defence on purpose to find its weaknesses."
  aliases: [red-team, red teaming, red-teaming]

classifier:
  definition: "A model that sorts inputs into categories, such as flagged or not flagged."
  aliases: [classifiers]

data poisoning:
  definition: "Deliberately slipping harmful examples into the material a model learns from so that it learns unwanted behaviour."

kin selection:
  definition: "Evolution favouring behaviour that helps relatives, because relatives carry many of the same genes."

kin recognition:
  definition: "The ability of an organism to treat relatives differently from unrelated individuals."

Jensen's inequality:
  definition: "The mathematical fact that averaging a curved relationship gives a different result from applying the relationship to the average."

root exudates:
  definition: "Chemicals that plant roots release into the surrounding soil."
  aliases: [root exudate, exudates]

dual-use:
  definition: "Useful both for protection and for harm, such as a tool that can find software flaws to fix or to attack."

hallucination rate:
  definition: "How often an AI model gives a confident answer that is false, measured in a specific way by each test."

evaluation harness:
  definition: "The software setup that feeds a test to an AI model and scores its answers, whose settings can change the results."
  aliases: [harness]
stage migration:
  definition: "When patients are moved into a different disease stage because of new tests or rules, rather than because their illness changed."
  aliases: [Will Rogers phenomenon]
metastasis:
  definition: "Cancer that has spread from where it started to another part of the body."
  aliases: [metastases]
Gleason score:
  definition: "A pathologist's rating of how abnormal prostate cancer cells look under the microscope, with higher numbers meaning more aggressive cancer."
person-years:
  definition: "A count that adds up how many years each person in a study was followed, so that people watched for different lengths of time can be combined."
cohort:
  definition: "A group of people defined by a shared starting point, such as being diagnosed in the same years, and followed over time."
  aliases: [cohorts]
reinforcement learning:
  definition: "A way of training a model by letting it try actions and rewarding the outcomes it reaches, so it learns which behaviour pays off."
GRPO:
  definition: "Group relative policy optimisation, a reinforcement learning method that scores each attempt against other attempts at the same task."
process supervision:
  definition: "Training that rewards each intermediate step of a task, not only the final outcome."

granular material:
  definition: "A collection of many separate solid grains, such as sand, rice or powder, that can flow but is neither a true liquid nor a true solid."
  aliases: [granular materials, granular media]

Monte Carlo simulation:
  definition: "A computer method that studies a system by running many repeated random trials and looking at what usually happens."
  aliases: [Monte Carlo simulations, Monte Carlo method]

convection:
  definition: "A slow circulating flow in which material rises in one place and sinks in another, carrying things along with it."

interstitial gas:
  definition: "The air or other gas filling the small spaces between grains in a pile or container of particles."

Responsible Scaling Policy:
  definition: "Anthropic's published framework that ties how it develops and releases AI models to the risk levels those models are judged to reach."
  aliases: [RSP]

Epoch Capabilities Index:
  definition: "A single score, developed by the research group Epoch AI, that combines results from many AI benchmarks to track overall model ability over time."
  aliases: [ECI]

full-time equivalent:
  definition: "A way of counting staff effort in which, for example, two people each working half time count as one full-time worker."
  aliases: [full-time equivalents]

choice overload:
  definition: "The claim that offering more options can make people less likely to choose anything, or less satisfied with what they pick."

heterogeneity:
  definition: "How much the results of different studies on the same question disagree with each other, beyond what chance alone would produce."

moderator:
  definition: "A condition that changes how strong an effect is, or whether it appears at all."
  aliases: [moderators]

cryo-electron microscopy:
  definition: "A method that images flash-frozen molecules with an electron beam and combines many pictures into a 3D model."
  aliases: [cryo-EM]

bacteriophage:
  definition: "A virus that infects bacteria."
  aliases: [bacteriophages, phage, phages]

size-exclusion chromatography:
  definition: "A way of separating molecules by size, by passing a mixture through a column packed with porous beads."
  aliases: [size-exclusion column]

paradox of enrichment:
  definition: "The prediction that giving prey more food can make a predator-prey system less stable rather than more."

functional response:
  definition: "How fast a predator eats as the amount of prey around it changes."
  aliases: [functional responses]

carrying capacity:
  definition: "The largest population an environment can support over the long run."

limit cycle:
  definition: "A repeating rise-and-fall pattern that a system settles into instead of a steady level."
  aliases: [limit cycles]

Hopf bifurcation:
  definition: "The point at which a steady system tips into regular oscillation as a setting is changed."
  aliases: [Hopf bifurcations]

chemostat:
  definition: "A culture vessel that continuously receives fresh nutrient liquid while an equal volume flows out."
  aliases: [chemostats]

data centre:
  definition: "A building full of computers that store data and run software, including AI models, for many users."
  aliases: [data centres, data center, data centers]

moratorium:
  definition: "A temporary pause on approving or building something, usually for a set number of months."
  aliases: [moratoriums]

megawatt:
  definition: "A unit of power equal to one million watts, roughly what several hundred homes use at once."
  aliases: [megawatts]

certification:
  definition: "The official step in which election authorities confirm final vote counts after checking all ballots."

resonance:
  definition: "A large build-up of vibration that happens when something is pushed repeatedly at the same rhythm it naturally swings at."
  aliases: [forced resonance, resonant]

flutter:
  definition: "A shaking or twisting motion that grows on its own because the structure's movement changes the airflow so the wind keeps pushing it further."
  aliases: [aeroelastic flutter, torsional flutter]

negative damping:
  definition: "A situation where the surroundings feed energy into a motion on each cycle instead of draining it away, so the motion grows."

vortex shedding:
  definition: "The regular peeling-off of swirls of air or water, first from one side and then the other, behind an object in a flow."

formal verification:
  definition: "Using mathematical proof, usually checked by a computer, to show that a program does exactly what a written specification says."
  aliases: [formally verified]

proof assistant:
  definition: "A computer program that checks every step of a mathematical proof and accepts it only if each step follows from the rules."
  aliases: [proof assistants]

forward secrecy:
  definition: "A guarantee that if someone steals a device's keys today, they still cannot read messages sent before the theft."

post-compromise security:
  definition: "A guarantee that after a device's keys are stolen, later messages become secret again once the protocol refreshes its keys."

trusted computing base:
  definition: "The parts of a system that are assumed to be correct rather than checked, so any error in them could undo the guarantees."
  aliases: [trusted base]

retrieval-induced forgetting:
  definition: "The finding that practising recall of some memories can make related memories that were not practised harder to recall later."

retrieval practice:
  definition: "Trying to bring something back to mind from memory, rather than simply reading it again."

independent-cue test:
  definition: "A memory test that asks for an item using a different prompt from the one it was learned with, to see whether forgetting follows the item itself."
  aliases: [independent-cue procedure, independent cue procedure]
